name: Release fx402

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Required when not pushing a tag."
        required: false

permissions:
  contents: write

concurrency:
  group: fx402-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: check
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag must be strict SemVer with a v prefix"
            exit 1
          fi
          SRC_VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VERSION" != "v${SRC_VERSION}" ]; then
            echo "::error::tag ${VERSION} does not match src/main.zig version ${SRC_VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/fx402-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx "$package_dir/fx402"
          cp LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "fx402-${{ matrix.name }}.tar.gz" -C "$package_dir" fx402 LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "fx402-${{ matrix.name }}.tar.gz" > "fx402-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx402-${{ matrix.name }}
          path: |
            fx402-${{ matrix.name }}.tar.gz
            fx402-${{ matrix.name }}.tar.gz.sha256

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fx402-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            fx402-*.tar.gz
            fx402-*.tar.gz.sha256
